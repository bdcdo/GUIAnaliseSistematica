name: Deploy frontend (Fly.io)

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-fly-deploy.yml'
      - '.github/scripts/check-frontend-fly-machines.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fly-deploy-frontend
  cancel-in-progress: false
  queue: max

jobs:
  deploy:
    name: flyctl deploy
    runs-on: ubuntu-latest
    steps:
      # Pin a SHA por supply-chain safety (mesma politica do setup-flyctl abaixo).
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      # Pin a SHA (tag 1.6) por supply-chain safety — @master é floating ref.
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
      - name: Recusar cardinalidade divergente antes do deploy
        run: bash .github/scripts/check-frontend-fly-machines.sh pre
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_FRONTEND }}
      - name: flyctl deploy
        working-directory: frontend
        env:
          # Token app-scoped DESTE app (gui-analise-sistematica-frontend). O
          # FLY_API_TOKEN compartilhado com o backend tem escopo do app da API
          # e dava `unauthorized` aqui — tokens de deploy do Fly sao por app.
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_FRONTEND }}
          # Chave AES base64 estavel entre builds. O BuildKit a entrega sem
          # diretivas Dockerfile ARG/ENV persistentes nem registro no historico.
          NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ${{ secrets.NEXT_SERVER_ACTIONS_ENCRYPTION_KEY }}
        run: |
          deploy_args=(
            --remote-only
            --ha=false
            -a gui-analise-sistematica-frontend
            --build-arg "NEXT_DEPLOYMENT_ID=${GITHUB_SHA}"
            --build-secret "NEXT_SERVER_ACTIONS_ENCRYPTION_KEY=${NEXT_SERVER_ACTIONS_ENCRYPTION_KEY}"
          )

          # Retry: o builder remoto (Depot, via --remote-only) as vezes encerra
          # a conexao no meio do build (rpc "goaway"/"graceful_stop") por causa
          # transitoria do lado do provedor, sem relacao com o codigo do app.
          for attempt in 1 2 3; do
            if flyctl deploy "${deploy_args[@]}"; then
              exit 0
            fi
            echo "flyctl deploy falhou (tentativa $attempt/3)"
            if [ "$attempt" -lt 3 ]; then
              sleep_time=$((attempt * 30))
              echo "Tentando novamente em ${sleep_time}s..."
              sleep "$sleep_time"
            fi
          done
          echo "flyctl deploy falhou apos 3 tentativas"
          exit 1
      - name: Verificar topologia e health depois do deploy
        run: bash .github/scripts/check-frontend-fly-machines.sh post
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_FRONTEND }}

  # Criar ou comentar uma issue nao dispara este workflow, que escuta apenas
  # push e workflow_dispatch; portanto a notificacao nao forma loop recursivo.
  notify-failure:
    name: Registrar falha do deploy
    needs: deploy
    if: ${{ always() && needs.deploy.result == 'failure' }}
    permissions:
      issues: write
    uses: ./.github/workflows/notify-deploy-failure.yml
    with:
      deploy_app: gui-analise-sistematica-frontend

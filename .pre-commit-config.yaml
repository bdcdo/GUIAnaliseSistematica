# Hooks de pre-commit + pre-push. Habilite uma vez por checkout com
# `pre-commit install` (instale antes: `uv tool install pre-commit`). O
# default_install_hook_types abaixo instala os DOIS estagios de uma vez, entao
# `pre-commit install` basta — voce nao precisa lembrar de rodar nada na mao.
#
# Divisao de estagios (ver docs/CODE_QUALITY_TOOLING.md):
#   pre-commit (todo commit, leve / file-scoped): gitleaks, ruff, actionlint,
#                                                deploy notifier, react-doctor
#   pre-push   (todo push,  pesado / grafo):       typecheck, vitest, e2e-smoke, lint:types, fallow, semgrep, backend-pytest, mypy, db-tests
#   post-checkout (informativo, nunca bloqueia):   worktree-env
#
# O CI roda o mesmo gitleaks em todo PR e push para `main` via
# .github/workflows/secret-scan.yml — este hook e a primeira barreira local.
default_install_hook_types: [pre-commit, pre-push, post-checkout]
# Hook sem `stages:` proprio roda so no pre-commit (os leves: gitleaks, ruff,
# actionlint, deploy notifier, react-doctor). Os pesados sobrescrevem com
# `stages: [pre-push]`. Sem este
# default, o pre-commit rodaria os leves tambem no push (default = todos os
# estagios), furando a divisao descrita abaixo.
default_stages: [pre-commit]

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # ruff: lint (E/F/I/B/C901) + format do backend Python. File-scoped pelo
  # framework (so os .py alterados), entao o debito legado fica grandfathered —
  # so barra/formata o arquivo que voce tocar. --fix auto-corrige imports e afins.
  # Config em backend/pyproject.toml; suppressions pontuais ficam inline no codigo.
  # O `rev` abaixo precisa acompanhar a versao do ruff travada em
  # backend/uv.lock: sao duas declaracoes da MESMA ferramenta, e versoes
  # diferentes fazem o hook e o `uv run ruff check .` divergirem em silencio.
  # O lock e a referencia — nao o `ruff>=X` do dependency-group dev em
  # backend/pyproject.toml, que e piso e nao versao: um `uv lock --upgrade` sobe
  # o lock sem tocar o piso, e ai o piso continua "satisfeito" com o rev velho.
  # O ecossistema `pre-commit` em .github/dependabot.yml existe para que os dois
  # sejam bumpados; sao PRs separados (grupo `backend-minor-patch` vs. avulso),
  # entao a convergencia e eventual e nenhum gate compara os dois hoje — ver #554.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.22
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^backend/.*\.py$
      - id: ruff-format
        files: ^backend/.*\.py$

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
        # v1.7.12 é anterior a `concurrency.queue`; o teste local abaixo valida
        # `queue: max` até o actionlint incorporar rhysd/actionlint#654.
        args: [-ignore, 'unexpected key "queue" for "concurrency" section']

  - repo: local
    hooks:
      # Contrato e comportamento do notificador de deploy. O hook extrai o
      # shell canônico do YAML e simula criação/comentário com um `gh` local.
      - id: deploy-failure-notification
        name: deploy failure notification
        entry: .github/scripts/test-deploy-failure-notification.sh
        language: system
        files: ^\.github/(workflows/(fly-deploy|frontend-fly-deploy|notify-deploy-failure)\.yml|scripts/test-deploy-failure-notification\.sh)$
        pass_filenames: false
        require_serial: true

      # Contrato de custo/disponibilidade do backend no Fly: o workflow só
      # converge de 0/1 para uma Machine e valida tamanho, região e health.
      - id: backend-fly-machine-contract
        name: backend Fly machine contract
        entry: .github/scripts/test-backend-fly-machine-contract.sh
        language: system
        files: ^(\.github/(workflows/fly-deploy\.yml|scripts/(check|test)-backend-fly-machine.*\.sh)|backend/fly\.toml)$
        pass_filenames: false
        require_serial: true

      # O frontend e always-on desde 2026-08-10, quando a Machine parou por
      # ociosidade e nao voltou (o host de gru estava sem CPU livre). Cada
      # deploy deve convergir para uma unica Machine saudavel e com o autostop
      # desligado — tanto no fly.toml quanto na config aplicada.
      - id: frontend-fly-machine-contract
        name: frontend Fly machine contract
        entry: .github/scripts/test-frontend-fly-machine-contract.sh
        language: system
        files: ^(\.github/(workflows/frontend-fly-deploy\.yml|scripts/(check|test)-frontend-fly-machine.*\.sh)|frontend/fly\.toml)$
        pass_filenames: false
        require_serial: true

      # react-doctor como gate local de qualidade React (estilo flake8/mypy).
      #
      # Por que --scope changed e nao --staged: o --staged escaneia o arquivo
      # staged inteiro (file-scoped), o que quebraria o grandfathering — tocar uma
      # linha de um arquivo com error legado em OUTRA linha barraria o commit. Ja
      # --scope changed --base HEAD reporta so issues nas linhas alteradas vs HEAD
      # (line-scoped, reproduzido na 0.5.8; ver docs/LINT_CONFIG.md); como o
      # pre-commit faz auto-stash dos unstaged, o
      # working tree fica == staged, entao enxerga o que vai ser commitado.
      #
      # --blocking warning bloqueia diagnosticos error E warning: agora que a
      # contagem esta zerada (bump 0.7.8, ver docs/LINT_CONFIG.md), codigo novo
      # com qualquer diagnostico e barrado; o debito legado fica grandfathered
      # pelo escopo line-scoped. O hook invoca o binario pinado em
      # frontend/node_modules/.bin — nao `npx` —, e uma guarda de versao no
      # script falha fechado se o instalado divergir do pino (node_modules
      # stale media com a ferramenta errada em silencio). Logica no script para
      # evitar inferno de aspas no YAML.
      - id: react-doctor
        name: react-doctor (changed lines, fail on new warnings/errors)
        entry: bash frontend/scripts/react-doctor-gate.sh
        language: system
        files: ^frontend/.*\.(mts|ts|tsx)$
        pass_filenames: false
        require_serial: true

      # --- pre-push: pesados, rodam uma vez por `git push` (nao por commit) ---

      # tsc --noEmit no projeto inteiro. Hoje passa limpo (0 erros), entao roda
      # full sem grandfathering — qualquer erro de tipo novo barra o push.
      - id: typecheck
        name: typecheck (tsc --noEmit, pre-push)
        entry: bash -c 'cd frontend && test -x ./node_modules/.bin/tsc && exec ./node_modules/.bin/tsc --noEmit || { echo "tsc ausente em frontend/node_modules; rode (cd frontend && npm install)" >&2; exit 1; }'
        language: system
        files: ^frontend/.*\.(mts|ts|tsx)$
        pass_filenames: false
        require_serial: true
        stages: [pre-push]

      # vitest run: suite unitaria/integracao completa. Hoje passa limpo, entao
      # roda full sem grandfathering — qualquer teste que quebre barra o push.
      # E o gate de regressao de teste que nem o build da Vercel nem o `next
      # build` do deploy Fly pegavam. Falha fechado se o binario estiver ausente.
      # Toda fonte JS/TS em modulo ESM dispara a suite inteira, inclusive regras
      # e configs ESLint. O glob por extensao nao acopla o hook a nomes de arquivo
      # — .mjs/.sh ja cobrem o bootstrap e o contrato de ambiente por extensao.
      # Os .env.*.example sao a excecao inevitavel: sao a fonte canonica das
      # variaveis obrigatorias e o teste do contrato afirma os nomes que eles
      # declaram, mas nao tem extensao pela qual casar.
      - id: vitest
        name: vitest run (full suite, pre-push)
        entry: bash -c 'cd frontend && test -x ./node_modules/.bin/vitest && exec ./node_modules/.bin/vitest run || { echo "vitest ausente em frontend/node_modules; rode (cd frontend && npm install)" >&2; exit 1; }'
        language: system
        files: ^frontend/(.*\.(mjs|mts|ts|tsx|sh)|\.env\.(local|e2e)\.example)$
        pass_filenames: false
        require_serial: true
        stages: [pre-push]

      # Playwright e2e smoke: fecha o loop aberto pela #107 (agent/CI travava
      # no login do Clerk sem Testing Tokens) fazendo esses specs rodarem sem
      # depender de alguem lembrar de digitar `npm run test:e2e` (issue #306).
      # Nao ha CI bloqueante (sem branch protection no free tier — ver
      # docs/CODE_QUALITY_TOOLING.md), entao pre-push e o unico lugar onde
      # "testar antes do PR" pode ser automatico de verdade.
      #
      # No modo manual (`npm run test:e2e`), os specs ainda fazem test.skip()
      # quando faltam variáveis E2E/Clerk, para permitir investigação parcial em
      # checkouts sem tenant de teste. No pre-push, porém, PLAYWRIGHT_PRE_PUSH=1
      # faz playwright.config.ts falhar fechado se qualquer env obrigatória
      # faltar: um gate não pode passar verde sem executar os fluxos autenticados.
      # Para pular pontualmente de forma explícita: `SKIP=e2e-smoke git push`.
      #
      # Por default, PLAYWRIGHT_PRE_PUSH=1 também usa uma porta dedicada (3100,
      # não a 3000 padrão) e nunca reaproveita um dev server já rodando. Um
      # E2E_BASE_URL explícito sobrescreve esse default e o PORT repassado ao
      # `next dev` acompanha a porta dessa URL.
      - id: e2e-smoke
        name: playwright e2e smoke (pre-push)
        entry: bash -c 'cd frontend && test -x ./node_modules/.bin/playwright && PLAYWRIGHT_PRE_PUSH=1 exec ./node_modules/.bin/playwright test || { echo "playwright ausente em frontend/node_modules; rode (cd frontend && npm install)" >&2; exit 1; }'
        language: system
        files: ^(\.pre-commit-config\.yaml|CLAUDE\.md|docs/CODE_QUALITY_TOOLING\.md|frontend/(.*\.(mjs|mts|ts|tsx|sh)|package(-lock)?\.json|\.env\.(local|e2e)\.example))$
        pass_filenames: false
        require_serial: true
        stages: [pre-push]

      # Provisiona .env.local/.env.e2e da worktree a partir da fonte canônica
      # (~/.config/dataframeitGUI/frontend por default). `git worktree add` e
      # `git checkout` disparam post-checkout, então uma worktree nova já nasce
      # com o ambiente ligado — antes isso dependia de lembrar de rodar o
      # bootstrap à mão, e o resultado era um parque com quatro estados
      # diferentes (link ok, link quebrado apontando para worktree removida,
      # ausente, e cópia real do arquivo com segredo dentro).
      #
      # NUNCA bloqueia: post-checkout roda depois de o checkout já ter ocorrido,
      # então falhar aqui só produz ruído — quem barra de verdade é o
      # assertRequiredPrePushEnv no e2e-smoke. Daí o `|| true`.
      #
      # Silencioso por design: com `|| true` o hook sempre "passa", e o
      # pre-commit suprime a saída de hook que passa — logo a mensagem do script
      # (ex.: "fonte canônica inexistente") NÃO aparece aqui, e nem deve, para
      # não poluir todo `git checkout`. O diagnóstico do link pendente / alvo
      # morto é responsabilidade do gate de pre-push (assertRequiredPrePushEnv),
      # que nomeia o symlink e o alvo inexistente na hora em que de fato importa.
      - id: worktree-env
        name: provisiona .env da worktree (post-checkout)
        entry: bash -c './frontend/scripts/worktree-env/bootstrap.sh || true'
        language: system
        always_run: true
        pass_filenames: false
        require_serial: true
        stages: [post-checkout]

      # typescript-eslint type-checked (no-floating-promises / no-misused-promises).
      # File-scoped via sed (strip do prefixo frontend/) → grandfathers os ~59
      # achados legados; so barra promessa nao-tratada em arquivo que voce tocar.
      - id: lint-types
        name: typescript-eslint type-checked (changed files, pre-push)
        entry: bash -c 'cd frontend && files=$(printf "%s\n" "$@" | sed "s|^frontend/||"); [ -z "$files" ] && exit 0; test -x ./node_modules/.bin/eslint && exec ./node_modules/.bin/eslint --config eslint.config.typed.mjs $files || { echo "eslint ausente em frontend/node_modules; rode (cd frontend && npm install)" >&2; exit 1; }' --
        language: system
        files: ^frontend/.*\.(mts|ts|tsx)$
        pass_filenames: true
        require_serial: true
        stages: [pre-push]

      # fallow audit: grafo do projeto (dead-code + complexidade + duplicacao)
      # escopado aos arquivos alterados. --gate new-only (default) so barra
      # achados INTRODUZIDOS — o baseline legado (56 dead-code, 121 clones, 260
      # hotspots) fica grandfathered.
      #
      # --base origin/main e explicito de proposito. Sem ele, o default do fallow
      # e a merge-base contra o UPSTREAM DA BRANCH, caindo para origin/main so
      # quando nao ha upstream (ver `fallow audit --help`). Numa branch ja pushada
      # o upstream e o head remoto dela, entao o gate passaria a medir apenas o
      # delta desde o ultimo push — e, depois de mergear a main na branch, trataria
      # os arquivos vindos da main como introduzidos aqui, barrando o push por
      # achado alheio. Fixar em origin/main faz o gate responder a pergunta certa:
      # o que ESTE PR introduz em relacao ao alvo do merge.
      - id: fallow-audit
        name: fallow audit (new findings block, pre-push)
        entry: bash -c 'cd frontend && test -x ./node_modules/.bin/fallow && exec ./node_modules/.bin/fallow audit --base origin/main || { echo "fallow ausente em frontend/node_modules; rode (cd frontend && npm install)" >&2; exit 1; }'
        language: system
        files: ^frontend/.*\.(mts|ts|tsx)$
        pass_filenames: false
        require_serial: true
        stages: [pre-push]

      # semgrep SAST (JS/TS + Python) via uvx, engine pinado (==1.168.0) para
      # reprodutibilidade e para fugir da regressao da serie 1.12x que retornava
      # exit 2 em runs limpos (que, sob o fail-open, tornaria o gate um no-op).
      # --baseline-commit limita aos achados NOVOS vs origin/main (mesma logica do
      # fallow: o `main` local costuma estar defasado). Falha fechado em achado
      # (exit 1); falha ABERTO em erro de infra/rede (exit>1) para nao travar push
      # offline. Rulesets p/... exigem rede na 1a vez (depois cacheados). Ver doc.
      - id: semgrep
        name: semgrep SAST (new findings, pre-push)
        entry: bash -c 'command -v uvx >/dev/null 2>&1 || { echo "uvx ausente — semgrep pulado" >&2; exit 0; }; base=$(git merge-base HEAD origin/main 2>/dev/null || git merge-base HEAD main 2>/dev/null || echo main); out=$(uvx --from semgrep==1.168.0 semgrep scan --config p/typescript --config p/react --config p/python --baseline-commit "$base" --error --quiet frontend backend 2>&1); code=$?; if [ "$code" = "1" ]; then echo "$out" >&2; echo "semgrep achou problema novo — corrija ou marque com nosemgrep" >&2; exit 1; fi; if [ "$code" -gt 1 ] 2>/dev/null; then echo "semgrep nao rodou (rede/config?) — push liberado" >&2; fi; exit 0'
        language: system
        pass_filenames: false
        require_serial: true
        stages: [pre-push]

      # pytest do backend como gate de pre-push: roda a suite inteira (auth,
      # rotas, cors) quando o push toca codigo ou o grafo/deploy do backend.
      # Diferente do semgrep
      # (fail-open em erro de infra), pytest e fail-CLOSED — sem `uv` o push
      # e barrado com mensagem, pois e um gate de verdade. `package = false`
      # no backend/pyproject.toml faz `uv run` nao tentar empacotar (issue #337).
      - id: backend-pytest
        name: pytest backend (pre-push)
        entry: bash -c 'command -v uv >/dev/null 2>&1 || { echo "uv ausente — instale o astral uv para rodar os testes do backend" >&2; exit 1; }; cd backend && exec uv run pytest -q'
        language: system
        files: ^(backend/(.*\.py|pyproject\.toml|uv\.lock|Dockerfile|\.dockerignore)|docker-compose\.yml)$
        pass_filenames: false
        require_serial: true
        stages: [pre-push]

      # mypy: type-check do backend, escopado aos .py alterados (mesmo padrao
      # do lint-types no frontend). services/llm_runner.py e isento via
      # [[tool.mypy.overrides]] em backend/pyproject.toml — concentrava 103
      # dos 113 erros do primeiro scan (explosao do alias JSON recursivo). A
      # #377 removeu a isencao C901 ao decompor run_llm, mas nao estreitou
      # esses tipos; remover a isencao mypy exige trabalho proprio. Ver
      # docs/CODE_QUALITY_TOOLING.md. O restante do baseline inicial (10 erros
      # em 4 arquivos: auth.py, pydantic_routes.py, pydantic_compiler.py,
      # main.py) foi corrigido na #380 — `uv run mypy .` roda limpo hoje fora
      # de llm_runner.py. O hook continua file-scoped por causa do
      # `follow_imports = "silent"` em [tool.mypy]: sem ele, checar so o
      # arquivo tocado tambem reportaria erros de qualquer modulo que ele
      # importe (ex.: services/auth.py, importado por quase toda rota) — nao
      # remover sem entender essa dependencia.
      - id: mypy
        name: mypy (changed files, pre-push)
        entry: bash -c 'cd backend && files=$(printf "%s\n" "$@" | sed "s|^backend/||"); [ -z "$files" ] && exit 0; command -v uv >/dev/null 2>&1 || { echo "uv ausente — instale o astral uv para rodar o mypy" >&2; exit 1; }; exec uv run mypy $files' --
        language: system
        files: ^backend/.*\.py$
        exclude: ^backend/tests/.*\.py$
        pass_filenames: true
        require_serial: true
        stages: [pre-push]

      # test:db como gate de pre-push fail-closed (issue #557). A cadeia de
      # suites SQL de contrato nao rodava em hook nenhum, entao quatro delas
      # ficaram vermelhas na main sem ninguem ver. O runner
      # (frontend/scripts/run-db-tests.sh) roda TODAS as suites numa varredura
      # (sem parar na primeira, ao contrario do antigo `&&`) e sai !=0 se
      # qualquer suite de GATE falhar. Requer o Supabase local no ar; sem o
      # container o push e barrado com mensagem (gate de verdade, como o
      # backend-pytest). As orfas schema_revision_* (#571/#572) estao em
      # KNOWN_RED no runner e sao reportadas sem bloquear ate serem consertadas.
      # Escopo por `files`: so roda quando o push toca migrations, suites .sql
      # ou os scripts do runner.
      - id: db-tests
        name: test:db (suites de contrato SQL, pre-push)
        entry: bash -c 'cd frontend && exec bash scripts/run-db-tests.sh'
        language: system
        files: ^frontend/(supabase/(migrations|tests)/.*\.sql|scripts/run-(db-tests|sql-test)\.sh|package\.json)$
        pass_filenames: false
        require_serial: true
        stages: [pre-push]

# Frontend Next.js 16 (standalone) no Fly.io.
# Secrets de runtime (CLERK_SECRET_KEY, SUPABASE_SERVICE_ROLE_KEY,
# CLERK_WEBHOOK_SECRET, AUTO_REVIEW_RECONCILIATION_SECRET) sao setadas via
# `fly secrets set`, nunca aqui.
# As NEXT_PUBLIC_* ficam em [build.args] porque precisam estar presentes em
# build time (sao embutidas no bundle do browser) e sao todas publicas por
# design (anon key e publishable key vao para o cliente de qualquer forma).
app = "gui-analise-sistematica-frontend"
primary_region = "gru"

# Swap como amortecedor de picos de memoria: o next-server chegava a ~152 MB
# de RSS sob trafego real e era OOM-killed nas VMs de 256 MB (2026-07-02).
swap_size_mb = 512

[build]
  dockerfile = "Dockerfile"

  [build.args]
    NEXT_PUBLIC_SUPABASE_URL = "https://nryebmwlmxuwvynfuzsv.supabase.co"
    NEXT_PUBLIC_SUPABASE_ANON_KEY = "sb_publishable_nqJGyzUd0ackkC9jSDTo3w_0xjg1hDd"
    NEXT_PUBLIC_API_URL = "https://gui-analise-sistematica-api.fly.dev"
    NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY = "pk_test_aW5ub2NlbnQtZm94aG91bmQtODguY2xlcmsuYWNjb3VudHMuZGV2JA"
    NEXT_PUBLIC_CLERK_SIGN_IN_URL = "/auth/login"
    NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL = "/dashboard"

[deploy]
  # A nova Machine precisa passar no health check antes de receber trafego; a
  # antiga so e removida depois, evitando indisponibilidade durante o deploy.
  strategy = "bluegreen"

[http_service]
  internal_port = 3000
  force_https = true
  # Always-on: rollback do scale-to-zero habilitado no #644, na forma que
  # aquele PR já previa ("restaurar auto_stop_machines = off e
  # min_machines_running = 1, mantendo uma única Machine").
  #
  # Em 2026-08-10 a Machine parou por ociosidade e não conseguiu voltar: cada
  # tentativa de acordá-la falhou com "could not reserve resource for machine:
  # insufficient CPUs available to fulfill request on the current host" — o
  # host de gru onde ela estava alocada ficou sem CPU livre. Como o proxy só
  # tenta reacender sob demanda, o resultado foi um loop de start/crash e o
  # site inteiro fora do ar até a Machine ser recriada em outro host.
  #
  # O custo do scale-to-zero, portanto, não é apenas o cold start medido: é
  # depender da capacidade do host no instante de acordar. Com a Machine
  # sempre ligada, esse instante deixa de existir no caminho crítico.
  #
  # auto_start_machines segue true de propósito: é a rede que reacende a
  # Machine se ela parar por outro motivo (restart, manutenção do host).
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/api/health"

[[vm]]
  # 512 MB persiste o `fly scale memory 512` de 2026-07-02: sem esta secao,
  # um `fly deploy` futuro recriaria as maquinas com o default de 256 MB e
  # o OOM-kill do next-server voltaria.
  size = "shared-cpu-1x"
  memory = "512mb"
